# Build and publish the site to GitHub Pages, refreshing the events data first.
#
# Runs on: every push to main, once a day (events refresh), and by hand.
# One workflow does both jobs on purpose — a commit pushed by GITHUB_TOKEN does
# not trigger other workflows, so a separate "refresh" workflow could never
# start the deploy.
#
# One-time setup in the repo: Settings → Pages → Source = "GitHub Actions".
# With a custom domain (rjchess.com) nothing else is needed. Without one, the
# site lives at https://<user>.github.io/<repo>/ and needs a basePath — see README.
name: Deploy
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 22 * * *"   # 03:30 IST daily — events refresh
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh events data
        run: node scripts/collect-events.mjs
      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add src/content/events.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh events data"
            # Another push may have landed while this ran: rebase and retry. If it still
            # can't push, carry on — the site still builds with the fresh data, and the
            # next run commits it.
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done || true
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_ENQUIRY_ENDPOINT: ${{ vars.NEXT_PUBLIC_ENQUIRY_ENDPOINT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
